# PLC Remote network-isolation defaults.
# nerves_runtime loads this file during boot.

# Preserve the Nerves default that allows unprivileged ping diagnostics.
net.ipv4.ping_group_range = 0 2147483647

# Forwarding is enabled only while the physical service switch requests the
# WPA2 service WLAN. PlcRemote.Service.Router installs scoped firewall rules.
net.ipv4.ip_forward = 0
net.ipv6.conf.all.forwarding = 0

# Do not learn or advertise routes through ICMP redirects or source routing.
net.ipv4.conf.all.accept_redirects = 0
net.ipv4.conf.default.accept_redirects = 0
net.ipv4.conf.all.send_redirects = 0
net.ipv4.conf.default.send_redirects = 0
net.ipv4.conf.all.accept_source_route = 0
net.ipv4.conf.default.accept_source_route = 0
net.ipv6.conf.all.accept_redirects = 0
net.ipv6.conf.default.accept_redirects = 0
