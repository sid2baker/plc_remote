name: Protected tailnet integration

on:
  workflow_dispatch:

permissions:
  contents: read

# This workflow intentionally has no pull_request trigger. Environment secrets
# are released only after the tailnet-integration protection rules are met.
concurrency:
  group: protected-tailnet-integration
  cancel-in-progress: false

jobs:
  live-tailnet:
    name: tailscale-rs and tailscaled interoperability
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment: tailnet-integration

    env:
      PLC_REMOTE_QEMU_ACCELERATOR: tcg
      PLC_REMOTE_TAILNET_TAGS: ${{ vars.PLC_REMOTE_TAILNET_TAGS }}
      TS_OAUTH_CLIENT_ID: ${{ secrets.TS_OAUTH_CLIENT_ID }}
      TS_OAUTH_SECRET: ${{ secrets.TS_OAUTH_SECRET }}

    steps:
      - name: Check out trusted main branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main

      - name: Refuse non-main workflow sources
        run: test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"

      - name: Verify protected configuration
        run: |
          test -n "$PLC_REMOTE_TAILNET_TAGS"
          test -n "$TS_OAUTH_CLIENT_ID"
          test -n "$TS_OAUTH_SECRET"

      - name: Install Nerves and QEMU system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            autoconf \
            automake \
            binutils \
            build-essential \
            clang \
            cmake \
            curl \
            file \
            git \
            help2man \
            libarchive-dev \
            libconfuse-dev \
            libmnl-dev \
            libncurses-dev \
            libssl-dev \
            jq \
            openssh-client \
            pkg-config \
            qemu-system-x86 \
            qemu-utils \
            squashfs-tools

      - name: Install mise
        uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
        with:
          install: false
          cache: true

      - name: Install pinned language and firmware tools
        run: |
          mise plugins install fwup https://github.com/fwup-home/asdf-fwup.git
          mise install

      - name: Restore dependency and build caches
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: |
            deps
            _build
            deps/tailscale/target
            ~/.cache/cargo
            ~/.cargo/git
            ~/.cargo/registry
            ~/.hex
            ~/.local/share/nerves
          key: ${{ runner.os }}-plc-remote-${{ hashFiles('.tool-versions', 'mix.lock', 'mix.exs', 'patches/**') }}
          restore-keys: |
            ${{ runner.os }}-plc-remote-

      - name: Install Rust target and Mix tooling
        run: |
          rustup target add x86_64-unknown-linux-musl --toolchain 1.95.0
          mix local.hex --force
          mix local.rebar --force
          mix archive.install hex nerves_bootstrap --force
          mkdir -p ~/.ssh
          ssh-keygen -q -t ed25519 -N '' -f ~/.ssh/id_ed25519

      - name: Connect trusted tailscaled peer
        uses: tailscale/github-action@780049a30b6ff5c378a9e7b389d15ece7a204888 # v4.1.3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: ${{ vars.PLC_REMOTE_TAILNET_TAGS }}
          hostname: plc-remote-ci-peer-${{ github.run_id }}

      - name: Fetch dependencies and build x86 firmware
        run: test/firmware/build.sh build

      - name: Verify invalid key fails closed
        run: mix test.invalid-key

      - name: Verify live enrollment, TCP proxy, and identity persistence
        env:
          PLC_REMOTE_TAILNET_SKIP_BUILD: "1"
        run: mix ci.tailnet

      - name: Upload protected QEMU diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: protected-tailnet-diagnostics
          path: |
            _build/qemu_tailnet/*.log
          if-no-files-found: ignore
          retention-days: 7
