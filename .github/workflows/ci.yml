name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  host-and-qemu:
    name: Host quality gates and x86 Nerves/QEMU
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    env:
      PLC_REMOTE_QEMU_ACCELERATOR: tcg

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # QEMU tests boot a complete Nerves image, so they cannot run inside ExUnit.
      - name: Install Nerves and QEMU system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            autoconf \
            automake \
            binutils \
            build-essential \
            clang \
            cmake \
            curl \
            file \
            git \
            help2man \
            libarchive-dev \
            libconfuse-dev \
            libmnl-dev \
            libncurses-dev \
            libssl-dev \
            openssh-client \
            pkg-config \
            qemu-system-x86 \
            qemu-utils \
            squashfs-tools

      - name: Install mise
        uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
        with:
          install: false
          cache: true

      - name: Install pinned language and firmware tools
        run: |
          mise plugins install fwup https://github.com/fwup-home/asdf-fwup.git
          mise install

      - name: Restore dependency and build caches
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: |
            deps
            _build
            ~/.cache/cargo
            deps/tailscale/target
            ~/.cargo/git
            ~/.cargo/registry
            ~/.hex
            ~/.local/share/nerves
          key: ${{ runner.os }}-plc-remote-${{ hashFiles('.tool-versions', 'mix.lock', 'mix.exs', 'patches/**') }}
          restore-keys: |
            ${{ runner.os }}-plc-remote-

      - name: Install Rust target and Mix tooling
        run: |
          rustup target add x86_64-unknown-linux-musl --toolchain 1.95.0
          mix local.hex --force
          mix local.rebar --force
          mix archive.install hex nerves_bootstrap --force
          mkdir -p ~/.ssh
          ssh-keygen -q -t ed25519 -N '' -f ~/.ssh/id_ed25519

      - name: Fetch host dependencies
        run: mix deps.get

      - name: Run complete host and deterministic firmware gate
        run: mix ci

      - name: Upload QEMU diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: qemu-diagnostics
          path: |
            _build/qemu_test/*.log
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload x86 integration firmware
        if: success()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: plc-remote-x86-firmware
          path: _build/x86_64_dev/nerves/images/plc_remote.fw
          if-no-files-found: error
          retention-days: 14
